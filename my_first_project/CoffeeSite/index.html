<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Coffee House</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
}

header{
    background:url("coffee.jpg") center/cover;
    height:400px;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
}

h1{
    font-size:60px;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:30px;
}

.card{
    background:#600bc8;
    padding:20px;
    margin:15px 0;
    border-radius:10px;
}

button{
    background:hsl(0, 97%, 49%);
    color:#0f1fca;
    border:none;
    padding:12px 25px;
    border-radius:5px;
    cursor:pointer;
}
</style>
</head>

<body>

<header>
    <h1>Кофейня Аромат</h1>
</header>

<div class="container">

    <div class="card">
        <h2>Наше меню</h2>
        <p>☕ Эспрессо — 1000 ₸</p>
        <p>☕ Капучино — 1500 ₸</p>
        <p>☕ Латте — 1700 ₸</p>
    </div>

    <div class="card">
        <h2>О нас</h2>
        <p>Свежий кофе и домашняя атмосфера каждый день.</p>
    </div>

    <button>Заказать</button>

</div>

</body>
</html>
